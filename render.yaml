services:
  - type: web
    name: market-atlas
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
